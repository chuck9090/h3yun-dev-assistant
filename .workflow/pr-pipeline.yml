version: '1.0'
name: build-package-pipeline
displayName: 技能文件打包流水线
stages:
  - stage: 
    name: package
    displayName: 打包
    steps:
      - step: build@shell
        name: build_shell
        displayName: 创建 ZIP 包
        commands:
          - mkdir -p dist
          - cp SKILL.md dist/
          - cp README.md dist/
          - cd dist && zip -r ../h3yun-dev-assistant.zip . && cd ..
        artifacts:
          - name: SKILL_PACKAGE
            path:
              - ./h3yun-dev-assistant.zip
      - step: publish@general_artifacts
        name: publish_skill_package
        displayName: 上传制品
        dependArtifact: SKILL_PACKAGE
        artifactRepository: default
        artifactName: h3yun-dev-assistant-skill
        dependsOn: build_shell
triggers:
  push:
    branches:
      include:
        - master
        - main
  pr:
    branches:
      include:
        - master
        - main
