name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package files
        shell: bash
        run: |
          test -f SKILL.md
          test -f references/BACKEND_GUIDELINES.md
          test -f references/FRONTEND_GUIDELINES.md
          test -f references/POST_GUIDELINES.md
          test -f references/SQL_GUIDELINES.md
          test -f references/OPENAPI_GUIDELINES.md
          test -f references/PLATFORM_CONSTRAINTS.md
          test -f references/DEV_DOC_ROUTING.md
          test -f references/FORM_ACTIONS_GUIDELINES.md
          test -f references/TOOL_FUNCTIONS.md

      - name: Create ZIP package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          archive="h3yun-dev-assistant-${version}.zip"
          # 先搭出同名技能目录，使 ZIP 顶层为 <skill-name>/SKILL.md，解压即符合 Agent Skills 规范
          mkdir -p "h3yun-dev-assistant"
          cp -r SKILL.md references "h3yun-dev-assistant/"
          zip -9 -r "${archive}" "h3yun-dev-assistant"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
