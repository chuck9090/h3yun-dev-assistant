name: Build and Package Skill

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create package directory
      run: |
        mkdir -p dist
        # 复制所有需要打包的文件到 dist 目录
        cp SKILL.md dist/
        cp README.md dist/
        # 如果有其他资源文件或示例代码,也可以在这里添加
        # cp -r examples/ dist/examples/ 2>/dev/null || true

    - name: Create ZIP archive
      run: |
        cd dist
        zip -r ../h3yun-dev-assistant.zip .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: h3yun-dev-assistant-skill
        path: h3yun-dev-assistant.zip
        retention-days: 30

    - name: Create Release (only on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: h3yun-dev-assistant.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
